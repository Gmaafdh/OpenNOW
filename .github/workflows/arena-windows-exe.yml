name: Windows executable
run-name: Windows x64 DX10 compatibility build (${{ github.ref_name }})

# Branch-scoped, unsigned test packages. No private runner pool, release
# publication, signing secrets, or changes to the production release pipeline.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/15b83ddf-opennow
      - arena/857f597a-opennow
      - arena/a9a90719-opennow
      - arena/c8d904a5-opennow
      - arena/2a2749e0-opennow

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate merged source and packaging contracts
    if: github.ref == 'refs/heads/arena/15b83ddf-opennow' || github.ref == 'refs/heads/arena/857f597a-opennow' || github.ref == 'refs/heads/arena/a9a90719-opennow' || github.ref == 'refs/heads/arena/c8d904a5-opennow' || github.ref == 'refs/heads/arena/2a2749e0-opennow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Test source and packaging contracts
        shell: bash
        run: |
          mkdir -p ci-logs
          python3 -m venv "$RUNNER_TEMP/qt-contracts"
          "$RUNNER_TEMP/qt-contracts/bin/python" -m pip install -r opennow-qt/packaging/icon-requirements.txt
          "$RUNNER_TEMP/qt-contracts/bin/python" -m unittest discover -s opennow-qt/tests -p 'test_*.py' \
            2>&1 | tee ci-logs/source-contracts.log
      - name: Validate localization and repository tooling
        shell: bash
        run: |
          npm run locales:check 2>&1 | tee ci-logs/locales-check.log
          node --test scripts/check-translations.test.mjs scripts/check-keyboard-layouts.test.mjs \
            2>&1 | tee ci-logs/node-tests.log
      - name: Publish source check failures
        if: failure()
        shell: bash
        run: python3 .github/scripts/report-build-log-failures.py ci-logs

  windows-x64:
    name: Build and test OpenNOW.exe
    needs: contracts
    permissions:
      contents: write
    if: github.ref == 'refs/heads/arena/15b83ddf-opennow' || github.ref == 'refs/heads/arena/857f597a-opennow' || github.ref == 'refs/heads/arena/c8d904a5-opennow' || (github.ref == 'refs/heads/arena/a9a90719-opennow' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[restore-windows-146.1]')))
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Map stable Windows workspace
        shell: pwsh
        run: .github/scripts/map-windows-workspace.ps1

      - name: Start Windows Media Foundation setup
        shell: pwsh
        run: .github/scripts/windows-media-foundation-background.ps1 Start

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pin the MSVC linker and locate LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $linker)) { throw "The MSVC x64 linker is unavailable." }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .github/scripts/ensure-windows-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools qtpositioning qtwebchannel
          cache: true
          cache-key-prefix: arena-windows-exe-qt

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arena-windows-exe-x64
          cache-bin: false
          cache-on-failure: true
          workspaces: |
            native/opennow-streamer -> target
            native/opennow-core -> target
            native/opennow-core -> ../../build/opennow-qt-release/rust-target
            native/opennow-core -> ../../build/opennow-qt-release/update-helper-rust-target
            native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Build and cache SDL3
        uses: ./.github/actions/sdl3
        with:
          version: release-3.2.20
          target-arch: x64
          parallel: "2"

      - name: Record immutable build identity
        shell: bash
        run: |
          cd /o
          mkdir -p ci-logs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python opennow-qt/packaging/nightly_release.py version \
            --run "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT")
          echo "OPENNOW_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          rustc -Vv
          cargo -V

      - name: Check Rust formatting
        shell: bash
        run: |
          cd /o
          cargo fmt --manifest-path native/opennow-core/Cargo.toml -- --check \
            2>&1 | tee ci-logs/core-format.log
          cargo fmt --manifest-path native/opennow-streamer/Cargo.toml --all -- --check \
            2>&1 | tee ci-logs/streamer-format.log

      - name: Finish Windows Media Foundation setup
        shell: pwsh
        run: |
          .github/scripts/windows-media-foundation-background.ps1 Wait
          .github/scripts/ensure-windows-media-foundation.ps1

      - name: Test merged application core
        shell: bash
        run: |
          cd /o
          cargo test --locked --manifest-path native/opennow-core/Cargo.toml --bin opennow-core \
            2>&1 | tee ci-logs/core-tests.log

      - name: Test Windows decode and protocol (including real WARP tests)
        shell: bash
        run: |
          cd /o
          cargo test --locked --manifest-path native/opennow-streamer/Cargo.toml \
            -p opennow-streamer-platform-windows -p opennow-streamer-protocol \
            -p opennow-streamer-platform --lib -- --test-threads=1 --nocapture \
            2>&1 | tee ci-logs/windows-tests.log
          cargo test --locked --manifest-path native/opennow-streamer/Cargo.toml \
            -p opennow-streamer-core --lib \
            standalone_fullscreen_uses_native_output_without_a_shell_shortcut \
            -- --nocapture 2>&1 | tee ci-logs/streamer-core-tests.log

      - name: Configure Qt release
        shell: bash
        run: |
          cd /o
          cmake -S opennow-qt -B build/opennow-qt-release \
            -G "Ninja Multi-Config" \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENNOW_BUILD_VERSION="$OPENNOW_BUILD_VERSION" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install" \
            2>&1 | tee ci-logs/cmake-configure.log

      - name: Build OpenNOW.exe and Qt regression tests
        shell: bash
        run: |
          cd /o
          cmake --build build/opennow-qt-release --config Release --parallel 4 \
            --target opennow-qt opennow-graphicsdevices-tests opennow-theme-tests \
              opennow-profileimage-tests opennow-queueselector-tests \
              opennow-nativestreamruntime-tests opennow-embedded-orchestration-tests \
            2>&1 | tee ci-logs/cmake-build.log

      - name: Test Qt graphics adapter and queue presentation
        shell: bash
        run: |
          cd /o
          status=0
          ctest --test-dir build/opennow-qt-release -C Release \
            -R '^(opennow-graphicsdevices-tests|opennow-theme-tests|opennow-profileimage-tests)$' \
            --output-on-failure --verbose --no-tests=error \
            2>&1 | tee ci-logs/ctest.log || status=$?
          QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 \
            QT_QPA_FONTDIR="$(cygpath -w "$PWD/opennow-qt/res/fonts")" \
            build/opennow-qt-release/Release/opennow-queueselector-tests.exe \
            -input opennow-qt/tests/queueselector -o ci-logs/queueselector-tests.log,txt \
            2>&1 | tee ci-logs/queueselector-console.log || {
              code=$?; echo "FAILED: queue selector unit exit $code" | tee -a ci-logs/queueselector-tests.log; status=$code;
            }
          if [[ -f ci-logs/queueselector-tests.log ]]; then
            cat ci-logs/queueselector-tests.log
          fi
          ctest --test-dir build/opennow-qt-release -C Release \
            -R '^opennow-nativestreamruntime-tests$' \
            --output-on-failure --verbose --no-tests=error \
            2>&1 | tee ci-logs/nativestreamruntime-tests.log || status=$?
          ctest --test-dir build/opennow-qt-release -C Release \
            -R '^opennow-embedded-orchestration-tests$' \
            --output-on-failure --verbose --no-tests=error \
            2>&1 | tee ci-logs/embedded-orchestration-tests.log || status=$?
          nativeResults=build/opennow-qt-release/opennow-nativestreamruntime-results.txt
          if [[ -f "$nativeResults" ]]; then
            cp "$nativeResults" ci-logs/nativestreamruntime-results.log
            cat "$nativeResults"
          fi
          orchestrationResults=build/opennow-qt-release/opennow-embedded-orchestration-results.txt
          if [[ -f "$orchestrationResults" ]]; then
            cp "$orchestrationResults" ci-logs/embedded-orchestration-results.log
            cat "$orchestrationResults"
          fi
          results=build/opennow-qt-release/opennow-theme-results.txt
          if [[ -f "$results" ]]; then
            cp "$results" ci-logs/theme-results.log
            cat "$results"
          fi
          exit "$status"

      - name: Exercise queue transition and capture the redesigned page
        shell: bash
        run: |
          cd /o
          # Exercise adapter selection with the production Windows QPA; the
          # isolated theme tests above use the offscreen platform instead.
          export QT_QPA_PLATFORM=windows
          export QT_FORCE_STDERR_LOGGING=1
          export QT_LOGGING_RULES='*.info=true'
          release="$PWD/build/opennow-qt-release/Release"
          smoke="$release/OpenNOW-Smoke.exe"
          cp "$release/OpenNOW.exe" "$smoke"
          editbin //SUBSYSTEM:CONSOLE "$(cygpath -w "$smoke")" 2>&1 | tee ci-logs/smoke-console.log
          screenshot=$(cygpath -w "$PWD/ci-logs/desktop-queue.png")
          status=0
          selectorScreenshot=$(cygpath -w "$PWD/ci-logs/queue-selector.png")
          "$smoke" \
            --smoke-test --allow-multiple-instances --desktop --route home \
            --smoke-queue-selector --smoke-width 1600 --smoke-height 900 \
            --reduced-motion --screenshot "$selectorScreenshot" \
            2>&1 | tee ci-logs/queue-selector-acceptance.log || status=$?
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if [[ ! -s ci-logs/queue-selector.png ]]; then
            echo "::error::The queue selector acceptance did not create queue-selector.png"
            exit 1
          fi
          homeScreenshot=$(cygpath -w "$PWD/ci-logs/home-dashboard.png")
          "$smoke" \
            --smoke-test --allow-multiple-instances --desktop --route home \
            --smoke-paper-design --smoke-width 1600 --smoke-height 900 \
            --screenshot "$homeScreenshot" \
            2>&1 | tee ci-logs/home-dashboard.log || status=$?
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if [[ ! -s ci-logs/home-dashboard.png ]]; then
            echo "::error::The Home dashboard acceptance did not create home-dashboard.png"
            exit 1
          fi
          "$smoke" \
            --smoke-test --allow-multiple-instances --desktop --route library \
            --smoke-session-launch --reduced-motion --screenshot "$screenshot" \
            2>&1 | tee ci-logs/queue-acceptance.log || status=$?
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if [[ ! -s ci-logs/desktop-queue.png ]]; then
            echo "::error::The session-launch acceptance did not create desktop-queue.png"
            exit 1
          fi
          "$smoke" \
            --smoke-test --allow-multiple-instances --desktop --route library \
            --smoke-game-labels --smoke-width 1600 --smoke-height 900 --reduced-motion \
            2>&1 | tee ci-logs/library-labels-acceptance.log || status=$?
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          "$smoke" \
            --smoke-test --allow-multiple-instances --desktop --route library \
            --smoke-collections --smoke-width 1440 --reduced-motion \
            2>&1 | tee ci-logs/library-collections-acceptance.log || status=$?
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          customizationScreenshot=$(cygpath -w "$PWD/ci-logs/customization.png")
          for width in 960 1440; do
            for mode in dark light; do
              customizationArgs=(--smoke-test --allow-multiple-instances --desktop
                --route settings-themes --smoke-theme-settings --reduced-motion
                --smoke-width "$width")
              if [[ "$mode" == light ]]; then
                customizationArgs+=(--smoke-light-theme)
              fi
              if [[ "$width" == 1440 && "$mode" == dark ]]; then
                customizationArgs+=(--screenshot "$customizationScreenshot")
              fi
              "$smoke" "${customizationArgs[@]}" \
                2>&1 | tee "ci-logs/customization-${width}-${mode}.log" || status=$?
              if [[ $status -ne 0 ]]; then exit "$status"; fi
            done
          done
          if [[ ! -s ci-logs/customization.png ]]; then
            echo "::error::The Customization acceptance did not create customization.png"
            exit 1
          fi
          accountScreenshot=$(cygpath -w "$PWD/ci-logs/account-picker-motion.png")
          "$smoke" \
            --smoke-test --allow-multiple-instances --desktop --route accounts \
            --smoke-paper-design --smoke-accounts 4 --smoke-account-chrome-check \
            --smoke-width 1440 --smoke-height 900 --screenshot "$accountScreenshot" \
            2>&1 | tee ci-logs/account-picker-motion.log || status=$?
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          if [[ ! -s ci-logs/account-picker-motion.png ]]; then
            echo "::error::The account-picker acceptance did not create account-picker-motion.png"
            exit 1
          fi
          # Exercise the native menu model with the production Windows QPA.
          # The generic CTest registration is offscreen and is not sufficient
          # for this full-app rendering and input acceptance.
          QT_QPA_FONTDIR="$(cygpath -w "$PWD/opennow-qt/res/fonts")" \
            "$smoke" \
            --smoke-test --allow-multiple-instances --desktop --route stream \
            --smoke-stream-controllers --smoke-width 1440 --smoke-height 900 \
            --reduced-motion \
            2>&1 | tee ci-logs/stream-controllers-acceptance.log || status=$?
          if [[ $status -ne 0 ]]; then exit "$status"; fi

      - name: Package portable ZIP
        shell: bash
        run: |
          cd /o
          cpack --config build/opennow-qt-release/CPackConfig.cmake \
            -C Release -G ZIP -B build/qt-packages \
            2>&1 | tee ci-logs/cpack.log

      - name: Verify payload and build setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location O:\
          . ./opennow-qt/packaging/windows-release.ps1
          $zip = @(Get-ChildItem build/qt-packages -Filter *.zip)
          if ($zip.Count -ne 1) { throw "Expected exactly one portable ZIP" }
          $payload = Join-Path $env:RUNNER_TEMP "opennow-exe-payload"
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $payload
          Assert-OpenNowPackagePayload -Root $payload -DeploymentRoot build/opennow-qt-release/Release
          $setup = Join-Path $zip[0].Directory.FullName ($zip[0].BaseName + "-setup.exe")
          ./opennow-qt/packaging/windows/build-setup.ps1 -Payload $payload `
            -Version $env:OPENNOW_BUILD_VERSION -Arch x64 -OutputFile $setup
          if ($LASTEXITCODE -ne 0) { throw "setup.exe creation failed" }
          @(
            "OpenNOW Windows x64 unsigned compatibility test build"
            "Version: $env:OPENNOW_BUILD_VERSION"
            "Source commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Portable: extract the ZIP completely, then launch bin\OpenNOW.exe."
            "Installer: run the -setup.exe. Both packages are unsigned."
            "DX10 fallback: H.264 8-bit SDR CPU decoding / D3D11 WARP presentation."
            "Runner tests do not qualify physical DX10 hardware or streaming performance."
          ) | Set-Content build/qt-packages/BUILD-INFO.txt -Encoding utf8
          Get-ChildItem build/qt-packages -File |
            Where-Object Extension -In @(".zip", ".exe") |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
            } | Set-Content build/qt-packages/SHA256SUMS -Encoding ascii
          # The fast update channel installs the portable ZIP. Its manifest pins
          # the exact size and SHA-256 that the in-app updater verifies before
          # replacing the installation; this build carries no signing key.
          $portable = @(Get-ChildItem build/qt-packages -Filter *.zip)
          if ($portable.Count -ne 1) { throw "Expected exactly one portable ZIP" }
          $manifest = [ordered]@{
            schemaVersion = 1
            version = $env:OPENNOW_BUILD_VERSION
            asset = $portable[0].Name
            size = $portable[0].Length
            sha256 = (Get-FileHash $portable[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            signature = ""
          }
          # Set-Content -Encoding utf8 writes a byte order mark on Windows
          # PowerShell, which JSON parsers reject, so write the text directly.
          $manifestPath = Join-Path $portable[0].DirectoryName ($portable[0].Name + ".manifest.json")
          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json))
          $raw = [System.IO.File]::ReadAllBytes($manifestPath)
          if ($raw.Length -ge 3 -and $raw[0] -eq 0xEF -and $raw[1] -eq 0xBB -and $raw[2] -eq 0xBF) {
            throw "The fast update manifest must not start with a byte order mark"
          }
          $read = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($read.schemaVersion -ne 1 -or $read.version -ne $env:OPENNOW_BUILD_VERSION `
              -or $read.asset -ne $portable[0].Name -or $read.size -ne $portable[0].Length `
              -or $read.sha256 -ne $manifest.sha256 -or $read.signature -ne "") {
            throw "The fast update manifest did not round-trip"
          }
          "FAST_UPDATE_ASSET=$($portable[0].Name)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows executable packages
        id: packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-Windows-x64-dx10
          path: |
            build/qt-packages/*.zip
            build/qt-packages/*-setup.exe
            build/qt-packages/BUILD-INFO.txt
            build/qt-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish the fast update channel
        if: github.run_number <= 146
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location O:\
          $manifest = Join-Path build/qt-packages ($env:FAST_UPDATE_ASSET + ".manifest.json")
          $zip = Join-Path build/qt-packages $env:FAST_UPDATE_ASSET
          if (-not (Test-Path $manifest)) { throw "The fast update manifest was not generated." }
          # One rolling pre-release holds the newest build, so the in-app
          # "Update now" button only ever needs to look at a single tag.
          gh release view arena-fast --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create arena-fast --repo $env:GITHUB_REPOSITORY `
              --target "$env:GITHUB_SHA" --title "Fast builds" --prerelease `
              --notes "Rolling Windows x64 compatibility build for the fast update channel. Each build replaces the previous one. These packages are checksum-verified, not signed."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the fast update release." }
          }
          # Replacing by name alone would leave older zips attached, and the
          # updater picks the first compatible asset it finds, so drop every
          # asset from the previous run before publishing this one.
          foreach ($id in (gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/arena-fast" --jq '.assets[].id')) {
            if (-not $id) { continue }
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$id"
            if ($LASTEXITCODE -ne 0) { throw "Could not remove a stale fast update asset." }
          }
          gh release upload arena-fast $zip $manifest build/qt-packages/BUILD-INFO.txt `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the fast update package." }

      - name: Write download summary
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.packages.outputs.artifact-url }}
        run: |
          @(
            "## Windows x64 unsigned test build"
            "[Download setup.exe and portable ZIP]($env:ARTIFACT_URL)"
            "Source: $env:GITHUB_SHA"
            "Extract the portable ZIP completely and launch bin\OpenNOW.exe."
            "Windows WARP/protocol, Qt adapter, and queue presentation tests passed."
            "Physical DX10 gameplay and performance still require device testing."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # Preserve error context through the GitHub checks API too: artifact/log
      # blob downloads are not accessible from every client environment.
      - name: Publish failure excerpts
        if: failure()
        shell: bash
        run: python .github/scripts/report-build-log-failures.py ci-logs

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-exe-build-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  restore-windows-146:
    name: Restore existing Windows nightly 146.1 (no rebuild)
    if: ${{ github.ref == 'refs/heads/arena/a9a90719-opennow' && github.event_name == 'push' && contains(github.event.head_commit.message, '[restore-windows-146.1]') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the already-built 146.1 package
        uses: actions/download-artifact@v4
        with:
          name: OpenNOW-Windows-x64-dx10
          repository: ${{ github.repository }}
          run-id: 42347482232
          github-token: ${{ github.token }}
          path: old-windows-146

      - name: Verify and restore the 146.1 update channel without building
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_dir=old-windows-146
          python3 - "$package_dir" <<'PYTHON'
          import hashlib, json, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          version = "1.0.3-nightly.146.1"
          zips = list(root.glob(f"OpenNOW-Qt-{version}-Windows-x64.zip"))
          setups = list(root.glob(f"OpenNOW-Qt-{version}-Windows-x64-setup.exe"))
          if len(zips) != 1 or len(setups) != 1:
              raise SystemExit("The archived artifact is not the expected 146.1 Windows package")
          info = (root / "BUILD-INFO.txt").read_text(encoding="utf-8-sig")
          if f"Version: {version}" not in info or "Source commit: b3d3c72948bc3732532041cb33edafb7b7497889" not in info:
              raise SystemExit("BUILD-INFO does not identify the approved 146.1 build")
          sums = (root / "SHA256SUMS").read_text(encoding="utf-8-sig").splitlines()
          for line in sums:
              expected, name = line.split(maxsplit=1)
              name = name.lstrip("* ")
              matches = list(root.glob(name))
              if len(matches) != 1 or hashlib.sha256(matches[0].read_bytes()).hexdigest() != expected.lower():
                  raise SystemExit(f"Checksum verification failed for {name}")
          with zipfile.ZipFile(zips[0]) as archive:
              if not any(name.replace("\\", "/").endswith("/bin/OpenNOW.exe") or name == "bin/OpenNOW.exe" for name in archive.namelist()):
                  raise SystemExit("The portable archive does not contain bin/OpenNOW.exe")
          digest = hashlib.sha256(zips[0].read_bytes()).hexdigest()
          manifest = {
              "schemaVersion": 1, "version": version, "asset": zips[0].name,
              "size": zips[0].stat().st_size, "sha256": digest, "signature": ""
          }
          (root / (zips[0].name + ".manifest.json")).write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          PYTHON
          zip=$(find "$package_dir" -maxdepth 1 -name 'OpenNOW-Qt-1.0.3-nightly.146.1-Windows-x64.zip' -print -quit)
          manifest="$zip.manifest.json"
          gh release view arena-fast --repo "$GITHUB_REPOSITORY" >/dev/null
          while IFS= read -r id; do
            [ -z "$id" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/arena-fast" --jq '.assets[].id')
          gh release upload arena-fast "$zip" "$manifest" \
            "$package_dir/BUILD-INFO.txt" "$package_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Restored 1.0.3-nightly.146.1 from its existing Actions artifact. No build was run." >> "$GITHUB_STEP_SUMMARY"

  publish-windows-146-release:
    name: Publish Windows nightly 146.1 as a full release
    if: ${{ github.ref == 'refs/heads/arena/2a2749e0-opennow' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-windows-146.1]') }}
    needs: contracts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the already-built 146.1 packages
        uses: actions/download-artifact@v4
        with:
          name: OpenNOW-Windows-x64-dx10
          repository: ${{ github.repository }}
          run-id: 42347482232
          github-token: ${{ github.token }}
          path: windows-146

      - name: Verify both 146.1 packages and publish the full release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_dir=windows-146
          python3 - "$package_dir" <<'PYTHON'
          import hashlib, json, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          version = "1.0.3-nightly.146.1"
          source_commit = "b3d3c72948bc3732532041cb33edafb7b7497889"
          zips = list(root.glob(f"OpenNOW-Qt-{version}-Windows-x64.zip"))
          setups = list(root.glob(f"OpenNOW-Qt-{version}-Windows-x64-setup.exe"))
          if len(zips) != 1 or len(setups) != 1:
              raise SystemExit("The archived artifact is not the expected 146.1 Windows package pair")
          info = (root / "BUILD-INFO.txt").read_text(encoding="utf-8-sig")
          if f"Version: {version}" not in info or f"Source commit: {source_commit}" not in info:
              raise SystemExit("BUILD-INFO does not identify the approved 146.1 build")
          named = set()
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8-sig").splitlines():
              if not line.strip():
                  continue
              expected, name = line.split(maxsplit=1)
              name = name.lstrip("* ")
              named.add(name)
              matches = list(root.glob(name))
              if len(matches) != 1 or hashlib.sha256(matches[0].read_bytes()).hexdigest() != expected.lower():
                  raise SystemExit(f"Checksum verification failed for {name}")
          if not {zips[0].name, setups[0].name} <= named:
              raise SystemExit("SHA256SUMS does not cover both the installer and the portable archive")
          with zipfile.ZipFile(zips[0]) as archive:
              if not any(name.replace("\\", "/").endswith("/bin/OpenNOW.exe") or name == "bin/OpenNOW.exe" for name in archive.namelist()):
                  raise SystemExit("The portable archive does not contain bin/OpenNOW.exe")
          digest = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in (zips[0], setups[0])}
          manifest = {
              "schemaVersion": 1, "version": version, "asset": zips[0].name,
              "size": zips[0].stat().st_size, "sha256": digest[zips[0].name], "signature": ""
          }
          (root / (zips[0].name + ".manifest.json")).write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          notes = [
              f"OpenNOW {version} for Windows x64 (DirectX 10 compatibility build).",
              "",
              f"Restored from the archived Actions artifact of run 42347482232, built from source commit `{source_commit[:12]}`. No build was run for this release.",
              "",
              "## Packages",
              "",
              f"- `OpenNOW-Qt-{version}-Windows-x64-setup.exe` - installer. SHA256 `{digest[setups[0].name]}`",
              f"- `OpenNOW-Qt-{version}-Windows-x64.zip` - portable archive; unpack and run `bin/OpenNOW.exe`. SHA256 `{digest[zips[0].name]}`",
              "",
              "Both packages are checksum-verified against `SHA256SUMS`. Neither is code-signed, so Windows SmartScreen warns on first run.",
              "",
              "This is a fixed point release. The rolling `arena-fast` pre-release that the in-app update button reads is left untouched.",
          ]
          (root / "RELEASE-NOTES.md").write_text("\n".join(notes) + "\n", encoding="utf-8")
          print("verified both packages: " + json.dumps(digest))
          PYTHON
          if gh release view 1.0.3-nightly.146.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release 1.0.3-nightly.146.1 already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create 1.0.3-nightly.146.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target b3d3c72948bc3732532041cb33edafb7b7497889 \
            --title "OpenNOW 1.0.3-nightly.146.1 (Windows x64)" \
            --notes-file "$package_dir/RELEASE-NOTES.md" \
            "$package_dir/OpenNOW-Qt-1.0.3-nightly.146.1-Windows-x64-setup.exe" \
            "$package_dir/OpenNOW-Qt-1.0.3-nightly.146.1-Windows-x64.zip" \
            "$package_dir/OpenNOW-Qt-1.0.3-nightly.146.1-Windows-x64.zip.manifest.json" \
            "$package_dir/BUILD-INFO.txt" \
            "$package_dir/SHA256SUMS"
          echo "Published 1.0.3-nightly.146.1 as a full release with the installer and the portable archive. No build was run." >> "$GITHUB_STEP_SUMMARY"

name: DirectX 10 Windows verification

# Fork-only harness. The repository's own CI (qt-ci.yml -> qt-build.yml) runs on the project's
# private Blacksmith runner pool, which a fork does not have, and its packaging jobs need signing
# secrets. These two jobs use GitHub-hosted Windows runners instead and do only what is needed to
# prove the DirectX 10 compatibility path compiles, passes its tests, and produces a runnable
# OpenNOW.exe. Do not merge this file upstream.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/19992b39-opennow

permissions:
  contents: read

env:
  # Plain logs: the annotation and grep steps below cannot match colored cargo output.
  CARGO_TERM_COLOR: never
  SDL_VERSION: release-3.2.20

jobs:
  rust-windows:
    name: Rust Windows streamer (compile, tests, clippy)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git Bash ships /usr/bin/link.exe, and cargo on a bash step resolves `link.exe` from PATH
      # before the MSVC toolchain, which fails every build script with "linking with `link.exe`
      # failed". Pin the MSVC linker explicitly, as the project's own Windows lane does.
      - name: Pin the MSVC x64 linker for cargo
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $linker)) { throw "The MSVC x64 linker is unavailable." }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "cargo linker: $linker"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arena-dx10-rust
          cache-on-failure: true
          workspaces: |
            native/opennow-core -> target
            native/opennow-streamer -> target

      # The Windows platform tests create real D3D11 devices and Media Foundation objects, so
      # record what this runner exposes. Missing video interfaces are an expected skip, not a
      # failure: that is the branch the DirectX 10 compatibility path replaces.
      # The upstream Windows lane installs LLVM and exports LIBCLANG_PATH before any cargo step;
      # build scripts that bind C headers fail with exit code 101 without it.
      - name: Point bindgen at libclang
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles "LLVM\bin"),
            (Join-Path ${env:ProgramFiles(x86)} "LLVM\bin"),
            "C:\Program Files\LLVM\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "libclang.dll") } |
            Select-Object -First 1
          if ($found) {
            "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "libclang: $found"
          } else {
            Write-Host "libclang.dll was not found; installing LLVM"
            choco install llvm -y --no-progress
            $llvm = Join-Path $env:ProgramFiles "LLVM\bin"
            if (-not (Test-Path (Join-Path $llvm "libclang.dll"))) { throw "LLVM install is incomplete" }
            "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Report runner graphics and media capability
        shell: pwsh
        run: |
          $mfplat = Join-Path $env:SystemRoot "System32\mfplat.dll"
          Write-Host "mfplat.dll present: $(Test-Path $mfplat)"
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, AdapterCompatibility | Format-List
          Get-WindowsFeature -Name Server-Media-Foundation -ErrorAction SilentlyContinue |
            Format-List Name, InstallState

      - name: Report toolchain
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            rustc -Vv
            cargo -V
            cmake --version | head -1
            ninja --version || true
            nasm -v 2>&1 | head -1 || true
            perl --version 2>&1 | head -3 || true
            cl 2>&1 | head -2 || true
          } > ci-logs/toolchain.txt 2>&1
          cat ci-logs/toolchain.txt

      # `npm run native:check` runs this without --locked, so match it: a stale lock in the core
      # workspace is a repository condition, not a result of this change.
      # opennow-core is untouched by the DirectX 10 change, so its result is reported but does not
      # gate this harness; the streamer workspace below is what carries the new code.
      - name: Check the core workspace (informational)
        continue-on-error: true
        shell: bash
        run: |
          cargo check --manifest-path native/opennow-core/Cargo.toml \
            2>&1 | tee ci-logs/core-check.log

      - name: Build the streamer workspace
        shell: bash
        run: |
          cargo build --locked --manifest-path native/opennow-streamer/Cargo.toml --workspace \
            2>&1 | tee ci-logs/streamer-build.log

      - name: Windows platform tests
        shell: bash
        run: |
          cargo test --locked --manifest-path native/opennow-streamer/Cargo.toml \
            -p opennow-streamer-platform-windows --lib -- --nocapture \
            2>&1 | tee ci-logs/windows-platform-tests.log

      - name: Capability report tests
        shell: bash
        run: |
          cargo test --locked --manifest-path native/opennow-streamer/Cargo.toml \
            -p opennow-streamer-platform --lib -- --nocapture \
            2>&1 | tee ci-logs/capability-tests.log

      - name: Clippy (workspace, all targets, warnings denied)
        shell: bash
        run: |
          {
            cargo clippy --manifest-path native/opennow-core/Cargo.toml --all-targets -- -D warnings
            cargo clippy --locked --manifest-path native/opennow-streamer/Cargo.toml \
              --workspace --all-targets -- -D warnings
          } 2>&1 | tee ci-logs/clippy.log

      # Reporting only: the repository has no rustfmt gate, but the formatted result is useful.
      - name: Capture rustfmt diff
        if: always()
        shell: bash
        run: |
          cargo fmt --manifest-path native/opennow-core/Cargo.toml --all || true
          cargo fmt --manifest-path native/opennow-streamer/Cargo.toml --all || true
          git --no-pager diff --stat || true
          git --no-pager diff > ci-logs/rustfmt.patch || true
          wc -l ci-logs/rustfmt.patch || true


      # Artifact blobs are not reachable from every environment, so the interesting lines are also
      # published as check annotations, which stay readable through the REST API. GitHub keeps at
      # most 50 error annotations per run, hence the hard cap.
      - name: Publish failure excerpts as annotations
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          combined=ci-logs/annotations.txt
          : > "$combined"
          for log in ci-logs/*.log; do
            [ -f "$log" ] || continue
            name=$(basename "$log")
            clean="ci-logs/$name.clean"
            sed -e "s/\x1b\[[0-9;]*m//g" "$log" | tr -d '\r' > "$clean"
            # Keep the lines after each error too: that is where rustc, CMake and MSVC print the
            # file, line and explanation.
            errors=$(grep -aE -A 12 \
              "^error(\[|:)|panicked at|CMake Error|FAILED:|error C[0-9]+|error LNK|test result: FAILED" \
              "$clean" | head -n 24)
            if [ -n "$errors" ]; then
              printf '%s\n' "$errors" | sed "s|^|$name: |" >> "$combined"
            else
              tail -n 3 "$clean" | sed "s|^|$name: |" >> "$combined"
            fi
          done
          head -n 48 "$combined" | while IFS= read -r line; do
            line=${line//%/%25}
            printf '::error title=ci-log::%s\n' "$line"
          done
          echo "annotation lines: $(wc -l < "$combined")"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ci-logs
          path: |
            ci-logs
            rustfmt.patch
          if-no-files-found: ignore

  qt-windows-exe:
    name: Qt Windows executable (OpenNOW.exe)
    # A commit tagged [no-qt] iterates on the Rust job only; the Qt build takes over an hour on a
    # two-core hosted runner and is skipped rather than duplicated.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no-qt]')
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The project's Windows build maps the checkout to a short drive letter to keep compiler and
      # CMake paths short; reuse that contract instead of inventing a second one.
      - name: Map stable Windows workspace
        shell: pwsh
        run: .github/scripts/map-windows-workspace.ps1

      - name: Enable Windows Media Foundation
        shell: pwsh
        continue-on-error: true
        run: .github/scripts/ensure-windows-media-foundation.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bound Windows Rust compilation
        shell: pwsh
        run: |
          "CARGO_BUILD_JOBS=2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:VSCMD_ARG_TGT_ARCH -eq "x64") {
            $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
            if (-not (Test-Path $linker)) { throw "The MSVC x64 linker is unavailable." }
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: arena-dx10-qt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arena-dx10-qt
          cache-on-failure: true
          workspaces: |
            native/opennow-core -> ../../build/opennow-qt-release/rust-target
            native/opennow-core -> ../../build/opennow-qt-release/update-helper-rust-target
            native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Build and cache SDL3
        uses: ./.github/actions/sdl3
        with:
          version: ${{ env.SDL_VERSION }}
          target-arch: x64
          parallel: 2

      - name: Configure Qt release
        shell: bash
        run: |
          cd /o
          mkdir -p ci-logs
          cmake -S opennow-qt -B build/opennow-qt-release \
            -G "Ninja Multi-Config" \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install" 2>&1 | tee ci-logs/cmake-configure.log

      # Only the application and the adapter-selection test are built: this harness is about the
      # DirectX 10 path, not the full release matrix.
      - name: Build OpenNOW.exe and the adapter selection test
        shell: bash
        run: |
          cd /o
          cmake --build build/opennow-qt-release --config Release --parallel 2 \
            --target opennow-qt opennow-graphicsdevices-tests 2>&1 | tee ci-logs/cmake-build.log | tail -n 400

      - name: Adapter selection tests
        shell: bash
        run: |
          cd /o
          ctest --test-dir build/opennow-qt-release -C Release \
            -R graphicsdevices --output-on-failure --no-tests=error 2>&1 | tee ci-logs/ctest.log

      - name: Report deployment payload
        shell: pwsh
        run: |
          $root = "O:\build\opennow-qt-release\Release"
          $exe = Join-Path $root "OpenNOW.exe"
          if (-not (Test-Path $exe)) { throw "OpenNOW.exe was not produced in $root" }
          $size = (Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Deployment root: {0} ({1:N0} MB)" -f $root, $size)
          Get-Item $exe | Select-Object Name, Length, LastWriteTime | Format-List
          (Get-Item $exe).VersionInfo | Format-List ProductName, ProductVersion, FileVersion

      # Uploaded before the package artifact so a failed build can be diagnosed while the rest of
      # the run is still going.

      # Artifact blobs are not reachable from every environment, so the interesting lines are also
      # published as check annotations, which stay readable through the REST API. GitHub keeps at
      # most 50 error annotations per run, hence the hard cap.
      - name: Publish failure excerpts as annotations
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          combined=ci-logs/annotations.txt
          : > "$combined"
          for log in ci-logs/*.log; do
            [ -f "$log" ] || continue
            name=$(basename "$log")
            clean="ci-logs/$name.clean"
            sed -e "s/\x1b\[[0-9;]*m//g" "$log" | tr -d '\r' > "$clean"
            # Keep the lines after each error too: that is where rustc, CMake and MSVC print the
            # file, line and explanation.
            errors=$(grep -aE -A 12 \
              "^error(\[|:)|panicked at|CMake Error|FAILED:|error C[0-9]+|error LNK|test result: FAILED" \
              "$clean" | head -n 24)
            if [ -n "$errors" ]; then
              printf '%s\n' "$errors" | sed "s|^|$name: |" >> "$combined"
            else
              tail -n 3 "$clean" | sed "s|^|$name: |" >> "$combined"
            fi
          done
          head -n 48 "$combined" | while IFS= read -r line; do
            line=${line//%/%25}
            printf '::error title=ci-log::%s\n' "$line"
          done
          echo "annotation lines: $(wc -l < "$combined")"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-ci-logs
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-Windows-x64-dx10
          path: O:/build/opennow-qt-release/Release
          if-no-files-found: error
          retention-days: 14

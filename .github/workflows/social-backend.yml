name: OpenNOW Social backend

on:
  push:
    branches:
      - arena/a9a90719-opennow
    paths:
      - services/social-backend/**
      - .github/workflows/social-backend.yml
  pull_request:
    paths:
      - services/social-backend/**
      - .github/workflows/social-backend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Social API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test backend API
        working-directory: services/social-backend
        run: npm test

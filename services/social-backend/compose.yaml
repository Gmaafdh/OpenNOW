services:
  social:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - social-data:/data
    expose:
      - "8787"
    networks:
      - social
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SOCIAL_DOMAIN: ${SOCIAL_DOMAIN:?Set SOCIAL_DOMAIN to a public DNS name pointing at this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - social
    depends_on:
      social:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  social-data:
  caddy-data:
  caddy-config:

networks:
  social:
